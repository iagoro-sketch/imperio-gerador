<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Roteirizador</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=35-10-36">
<style>
html,body{height:100%;margin:0;background:#061320;color:#eaf2fb;font-family:Segoe UI,Arial,sans-serif}
#load{height:100%;display:flex;align-items:center;justify-content:center;text-align:center}
.box{padding:28px 34px;border:1px solid #24435f;border-radius:18px;background:#0b1d30;box-shadow:0 25px 70px rgba(0,0,0,.35)}
.logo{font-size:28px;font-weight:900;margin-bottom:8px}.sub{font-size:12px;color:#91a8c0}.err{color:#ff8794;max-width:560px;line-height:1.5}
</style>
</head>
<body>
<div id="load"><div class="box"><div class="logo">Painel Roteirizador</div><div class="sub">Carregando sistema...</div></div></div>
<script>
(async()=>{
 try{
  const r=await fetch('./app-v34.b64?v=35-10-35',{cache:'no-store'});
  if(!r.ok)throw new Error('Arquivo do sistema não encontrado.');
  const b64=(await r.text()).replace(/\s+/g,'');
  const bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(!('DecompressionStream' in window))throw new Error('Atualize o Chrome ou Edge para abrir o painel.');
  const ds=new DecompressionStream('gzip');
  let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  html=html.replace(/<title\b[^>]*>[\s\S]*?<\/title>/i,'<title>Painel Roteirizador</title>');
  const pre='<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=35-10-36"><style id="dwsRestoreCss">html.dws-restore-hold body{visibility:hidden!important}</style><script>try{localStorage.removeItem("dws_auth_keep_v1");const st=JSON.parse(localStorage.getItem("dws_ui_state_v1")||"{}")||{};window.__DWS_RESTORE_STATE=st;const ok=sessionStorage.getItem("dws_auth_v34")==="1";if(ok&&st.view)document.documentElement.classList.add("dws-restore-hold")}catch(e){}<\/script>';
  if(html.includes('</head>'))html=html.replace('</head>',pre+'</head>');
  const patch='<script src="./buffer-v35-10-13.js?v=35-10-24"><\/script><script src="./buffer-v35-10-25-age.js?v=35-10-25"><\/script><script src="./kpi-v35-10-26-loader.js?v=35-10-38"><\/script><script src="./kpi-v35-10-27.js?v=35-10-27"><\/script><script src="./kpi-v35-10-28-km.js?v=35-10-28"><\/script><script src="./kpi-v35-10-29-km-fix.js?v=35-10-29"><\/script><script src="./kpi-v35-10-30-km-final.js?v=35-10-30"><\/script><script src="./kpi-v35-10-31-km-dom.js?v=35-10-32"><\/script><script src="./kpi-v35-10-37-diario-jan-ago.js?v=35-10-38"><\/script><script src="./state-v35-10-35.js?v=35-10-35"><\/script>';
  html=html.includes('</body>')?html.replace('</body>',patch+'</body>'):html+patch;
  document.open();document.write(html);document.close();
  document.title='Painel Roteirizador';
 }catch(e){
  document.getElementById('load').innerHTML='<div class="box err"><b>Não foi possível abrir o Painel Roteirizador.</b><br><br>'+String(e.message||e)+'</div>';
 }
})();
</script>
</body>
</html>
